<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 不摆烂研习社</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.auth-container {
  background: #fff;
  border-radius: 20px;
  padding: 40px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.logo { text-align: center; margin-bottom: 30px; }
.logo .icon { font-size: 48px; }
.logo h1 { font-size: 24px; color: #333; margin-top: 8px; }
.logo p { font-size: 13px; color: #999; margin-top: 4px; }
.tabs {
  display: flex;
  margin-bottom: 24px;
  background: #f5f5f5;
  border-radius: 10px;
  padding: 4px;
}
.tab {
  flex: 1;
  padding: 10px;
  text-align: center;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: #666;
  transition: all 0.2s;
}
.tab.active { background: #667eea; color: #fff; }
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 13px;
  color: #555;
  margin-bottom: 6px;
  font-weight: 500;
}
.form-group input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid #e8e8e8;
  border-radius: 10px;
  font-size: 15px;
  transition: border-color 0.2s;
  outline: none;
}
.form-group input:focus { border-color: #667eea; }
.btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
}
.btn-primary {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
}
.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.btn-outline {
  background: #fff;
  color: #667eea;
  border: 2px solid #667eea;
}
.btn-outline:hover { background: #f8f7ff; }
.divider {
  text-align: center;
  margin: 20px 0;
  color: #ccc;
  font-size: 13px;
  position: relative;
}
.divider::before, .divider::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 40%;
  height: 1px;
  background: #eee;
}
.divider::before { left: 0; }
.divider::after { right: 0; }
.msg {
  font-size: 13px;
  margin-top: 8px;
  display: none;
  text-align: center;
  padding: 8px;
  border-radius: 8px;
}
.msg.error { color: #e74c3c; background: #fdf2f2; }
.msg.success { color: #27ae60; background: #f0fdf4; }
.form-panel { display: none; }
.form-panel.active { display: block; }
.nickname-hint {
  font-size: 12px;
  color: #999;
  margin-top: 4px;
}
.import-section {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid #eee;
}
.import-section h3 {
  font-size: 14px;
  color: #333;
  margin-bottom: 12px;
}
.import-section p {
  font-size: 12px;
  color: #999;
  margin-bottom: 8px;
}
.supabase-status {
  text-align: center;
  font-size: 11px;
  color: #999;
  margin-top: 20px;
}
.supabase-status.connected { color: #27ae60; }
.supabase-status.disconnected { color: #e67e22; }
</style>
</head>
<body>

<div class="auth-container">
  <div class="logo">
    <div class="icon">☁️</div>
    <h1>不摆烂研习社</h1>
    <p>考研备考 · 云端同步 · 多设备登录</p>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="login">登录</div>
    <div class="tab" data-tab="register">注册</div>
  </div>

  <!-- 登录面板 -->
  <div class="form-panel active" id="loginPanel">
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" id="loginEmail" placeholder="请输入注册邮箱">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="loginPassword" placeholder="请输入密码">
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="handleLogin()">登 录</button>
    <div class="msg error" id="loginError"></div>
    <div class="divider">或</div>
    <button class="btn btn-outline" onclick="skipLogin()">跳过登录，本地使用</button>
  </div>

  <!-- 注册面板 -->
  <div class="form-panel" id="registerPanel">
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" id="regEmail" placeholder="用于登录和找回密码">
    </div>
    <div class="form-group">
      <label>昵称</label>
      <input type="text" id="regNickname" placeholder="在研友圈中显示的名字">
      <div class="nickname-hint">可以随时修改</div>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="regPassword" placeholder="至少6位密码">
    </div>
    <div class="form-group">
      <label>确认密码</label>
      <input type="password" id="regPassword2" placeholder="再次输入密码">
    </div>
    <button class="btn btn-primary" id="regBtn" onclick="handleRegister()">注 册</button>
    <div class="msg error" id="regError"></div>
    <div class="msg success" id="regSuccess"></div>
  </div>

  <!-- 换设备：导入数据 -->
  <div class="import-section">
    <h3>📱 换设备？导入之前的数据</h3>
    <p>在旧设备上登录后点击「导出数据」，把文件发到新设备，然后在这里导入。</p>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
    <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">📥 导入数据文件</button>
    <div class="msg error" id="importError"></div>
    <div class="msg success" id="importSuccess"></div>
  </div>

  <div class="supabase-status" id="supabaseStatus">🔗 检查服务连接中...</div>
</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ==================== Supabase 配置 ====================
const SUPABASE_URL = 'https://gmnkebtoaxadityitklp.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_UUJh0srqIrr8PBVrhH4u9Q_P7B6RkU-';

let supabase = null;

try {
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  document.getElementById('supabaseStatus').textContent = '☁️ 云端同步已就绪';
  document.getElementById('supabaseStatus').className = 'supabase-status connected';
} catch(e) {
  document.getElementById('supabaseStatus').textContent = '⚠️ 云端服务未配置，使用本地模式';
  document.getElementById('supabaseStatus').className = 'supabase-status disconnected';
}

// ==================== Tab 切换 ====================
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
    document.getElementById(tab.dataset.tab === 'login' ? 'loginPanel' : 'registerPanel').classList.add('active');
    hideMessages();
  });
});

function hideMessages() {
  ['loginError', 'regError', 'regSuccess', 'importError', 'importSuccess'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
  });
}

// 回车键提交
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('loginPanel').classList.contains('active')) handleLogin();
    else handleRegister();
  }
});

// ==================== 登录 ====================
async function handleLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  hideMessages();

  if (!email || !password) {
    showMsg(errEl, '请填写邮箱和密码');
    return;
  }

  btn.disabled = true;
  btn.textContent = '登录中...';

  // 尝试 Supabase 登录
  if (supabase) {
    try {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        if (error.message.includes('Invalid login credentials')) {
          showMsg(errEl, '邮箱或密码错误');
        } else {
          showMsg(errEl, error.message);
        }
        btn.disabled = false;
        btn.textContent = '登 录';
        return;
      }

      if (data.user) {
        // 保存用户信息到本地
        const nickname = data.user.user_metadata?.nickname || email.split('@')[0];
        localStorage.setItem('study_current_user', JSON.stringify({
          username: email,
          nickname: nickname,
          userId: data.user.id,
          email: email,
          loginTime: new Date().toISOString()
        }));
        localStorage.removeItem('study_auth_skip');

        // 拉取云端数据
        await pullCloudData(data.user.id);
        window.location.href = 'index.html';
        return;
      }
    } catch (e) {
      // Supabase 请求失败，降级到本地登录
      console.log('Supabase 登录失败，尝试本地登录:', e.message);
      localLogin(email, password, errEl, btn);
      return;
    }
  }

  // Supabase 不可用时，尝试本地登录
  localLogin(email, password, errEl, btn);
}

// 本地登录（fallback）
function localLogin(email, password, errEl, btn) {
  try {
    const accounts = JSON.parse(localStorage.getItem('study_accounts') || '{}');
    const account = accounts[email];

    if (!account) {
      showMsg(errEl, '账号不存在，请先注册');
      btn.disabled = false;
      btn.textContent = '登 录';
      return;
    }

    // 简单密码验证
    const hash = 'h_' + Math.abs(email.length * 31 + password.split('').reduce((s,c)=>s+c.charCodeAt(0),0)).toString(36);
    if (account.password !== hash && account.password !== simpleHash(password)) {
      showMsg(errEl, '密码错误');
      btn.disabled = false;
      btn.textContent = '登 录';
      return;
    }

    localStorage.setItem('study_current_user', JSON.stringify({
      username: email,
      nickname: account.nickname || email.split('@')[0],
      loginTime: new Date().toISOString()
    }));
    localStorage.removeItem('study_auth_skip');
    window.location.href = 'index.html';
  } catch(e) {
    showMsg(errEl, '登录失败');
    btn.disabled = false;
    btn.textContent = '登 录';
  }
}

function simpleHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const char = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash |= 0;
  }
  return 'h_' + Math.abs(hash).toString(36);
}

// ==================== 注册 ====================
async function handleRegister() {
  const email = document.getElementById('regEmail').value.trim();
  const nickname = document.getElementById('regNickname').value.trim();
  const password = document.getElementById('regPassword').value.trim();
  const password2 = document.getElementById('regPassword2').value.trim();
  const errEl = document.getElementById('regError');
  const sucEl = document.getElementById('regSuccess');
  const btn = document.getElementById('regBtn');

  hideMessages();

  if (!email || !nickname || !password) {
    showMsg(errEl, '请填写所有字段');
    return;
  }

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showMsg(errEl, '请输入有效的邮箱地址');
    return;
  }

  if (password.length < 6) {
    showMsg(errEl, '密码至少6位');
    return;
  }
  if (password !== password2) {
    showMsg(errEl, '两次密码不一致');
    return;
  }

  btn.disabled = true;
  btn.textContent = '注册中...';

  // 尝试 Supabase 注册
  if (supabase) {
    try {
      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
        options: {
          data: { nickname: nickname }
        }
      });

      if (error) {
        if (error.message.includes('already registered') || error.message.includes('already exists')) {
          showMsg(errEl, '该邮箱已注册，请直接登录');
        } else {
          showMsg(errEl, error.message);
        }
        btn.disabled = false;
        btn.textContent = '注 册';
        return;
      }

      if (data.user) {
        // 自动登录
        localStorage.setItem('study_current_user', JSON.stringify({
          username: email,
          nickname: nickname,
          userId: data.user.id,
          email: email,
          loginTime: new Date().toISOString()
        }));
        localStorage.removeItem('study_auth_skip');

        showMsg(sucEl, '注册成功！正在跳转...');
        setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        return;
      }

      // 需要邮箱验证
      showMsg(sucEl, '注册成功！如需邮箱验证，请查看邮箱后登录。');
      btn.disabled = false;
      btn.textContent = '注 册';
      return;
    } catch (e) {
      showMsg(errEl, '网络错误，请检查网络连接');
      btn.disabled = false;
      btn.textContent = '注 册';
      return;
    }
  }

  // 本地注册（fallback）
  localRegister(email, nickname, password, errEl, sucEl, btn);
}

function localRegister(email, nickname, password, errEl, sucEl, btn) {
  try {
    const accounts = JSON.parse(localStorage.getItem('study_accounts') || '{}');
    if (accounts[email]) {
      showMsg(errEl, '该邮箱已注册，请直接登录');
      btn.disabled = false;
      btn.textContent = '注 册';
      return;
    }

    accounts[email] = {
      password: simpleHash(password),
      nickname: nickname,
      createdAt: new Date().toISOString()
    };
    localStorage.setItem('study_accounts', JSON.stringify(accounts));

    localStorage.setItem('study_current_user', JSON.stringify({
      username: email,
      nickname: nickname,
      loginTime: new Date().toISOString()
    }));
    localStorage.removeItem('study_auth_skip');

    showMsg(sucEl, '注册成功！正在跳转...');
    setTimeout(() => { window.location.href = 'index.html'; }, 800);
  } catch(e) {
    showMsg(errEl, '注册失败');
    btn.disabled = false;
    btn.textContent = '注 册';
  }
}

// ==================== 云端数据拉取 ====================
async function pullCloudData(userId) {
  if (!supabase) return;
  try {
    const { data, error } = await supabase
      .from('user_data')
      .select('data, nickname')
      .eq('user_id', userId)
      .single();

    if (error || !data || !data.data) return;

    const userData = data.data;
    Object.keys(userData).forEach(key => {
      const storageKey = 'study_' + key;
      const value = userData[key];
      if (typeof value === 'string') {
        localStorage.setItem(storageKey, value);
      } else {
        localStorage.setItem(storageKey, JSON.stringify(value));
      }
    });
  } catch(e) {
    console.log('拉取云端数据失败:', e.message);
  }
}

// ==================== 跳过登录 ====================
function skipLogin() {
  localStorage.setItem('study_auth_skip', 'true');
  localStorage.removeItem('study_current_user');
  window.location.href = 'index.html';
}

// ==================== 导入数据 ====================
function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const data = JSON.parse(e.target.result);
      const errEl = document.getElementById('importError');
      const sucEl = document.getElementById('importSuccess');

      hideMessages();

      if (!data.exportType || data.exportType !== 'beikao_backup') {
        showMsg(errEl, '无效的数据文件格式');
        return;
      }

      // 导入用户数据
      if (data.userData) {
        Object.keys(data.userData).forEach(key => {
          const storageKey = 'study_' + key;
          const value = data.userData[key];
          if (typeof value === 'string') {
            localStorage.setItem(storageKey, value);
          } else {
            localStorage.setItem(storageKey, JSON.stringify(value));
          }
        });
      }

      // 导入账号信息（兼容旧格式）
      if (data.accounts) {
        const existing = JSON.parse(localStorage.getItem('study_accounts') || '{}');
        const merged = { ...existing, ...data.accounts };
        localStorage.setItem('study_accounts', JSON.stringify(merged));
      }

      // 如果当前有 Supabase 且已登录，推送到云端
      if (supabase) {
        const { data: sessionData } = await supabase.auth.getSession();
        if (sessionData?.session?.user) {
          await pushLocalToCloud(sessionData.session.user.id);
        }
      }

      showMsg(sucEl, '数据导入成功！请用原来的账号登录，或直接进入主页。');
    } catch (err) {
      const errEl = document.getElementById('importError');
      showMsg(errEl, '文件解析失败：' + err.message);
    }
  };
  reader.readAsText(file);
}

async function pushLocalToCloud(userId) {
  if (!supabase) return;
  const userData = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith('study_') &&
        key !== 'study_accounts' &&
        key !== 'study_current_user' &&
        key !== 'study_all_user_data' &&
        key !== 'study_auth_skip') {
      try {
        userData[key.substring(6)] = JSON.parse(localStorage.getItem(key));
      } catch {
        userData[key.substring(6)] = localStorage.getItem(key);
      }
    }
  }

  try {
    await supabase.from('user_data').upsert({
      user_id: userId,
      data: userData,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id' });
  } catch(e) {
    console.log('推送数据失败:', e.message);
  }
}

function showMsg(el, msg) {
  el.textContent = msg;
  el.style.display = 'block';
}
</script>

</body>
</html>
