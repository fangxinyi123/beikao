<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>不摆烂研习社 - 考研备考工具箱</title>
<link rel="stylesheet" href="style.css?v=20260605c">
</head>
<body>
  <div id="app">
    <!-- 顶部导航 -->
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title">
          <span class="logo-icon">🔥</span>
          <span class="logo-text">不摆烂研习社</span>
        </h1>
        <span id="headerMotto" class="header-motto"></span>
      </div>
      <div class="header-right">
        <span id="userInfo" class="user-info"></span>
        <button id="exportDataBtn" class="theme-toggle" title="导出数据（换设备用）" style="margin-right:4px;font-size:14px">📥</button>
        <button id="themeToggle" class="theme-toggle">🌙</button>
      </div>
    </header>

    <!-- 主内容区 -->
    <main id="contentArea" class="content-area"></main>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <div class="nav-item active" data-tab="dashboard">📊 面板</div>
      <div class="nav-item" data-tab="checkin">🔥 打卡</div>
      <div class="nav-item" data-tab="tasks">✅ 任务</div>
      <div class="nav-item" data-tab="focus">⏱️ 专注</div>
      <div class="nav-item" data-tab="memo">📋 备忘</div>
      <div class="nav-item" data-tab="errors">❌ 错题</div>
      <div class="nav-item" data-tab="notes">📒 笔记</div>

      <div class="nav-item" data-tab="reading">📰 外刊</div>
      <div class="nav-item" data-tab="quiz">📝 刷题</div>
      <div class="nav-item" data-tab="challenge">⚡ 挑战</div>
      <div class="nav-item" data-tab="buddies">💬 研友</div>
      <div class="nav-item" data-tab="weekly">📊 周报</div>

    </nav>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- 模态框 -->
  <div id="modalOverlay" class="modal-overlay">
    <div id="modal" class="modal">
      <div class="modal-header">
        <h3 id="modalTitle"></h3>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-footer">
        <button id="modalCancelBtn" class="btn btn-cancel" onclick="closeModal()">取消</button>
        <button id="modalSaveBtn" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <script src="data-loader.js?v=20260604e"></script>
  <script src="cloud-sync.js?v=20260604e"></script>
  <script src="app.js?v=20260605c"></script>
</body>
</html>
